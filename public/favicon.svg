<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Paper and ink, like the rest of it. A lowercase n, set in the prose face,
       on the same warm ground as the page. -->
  <rect width="32" height="32" rx="7" fill="#f4f2ed"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" fill="none" stroke="#e2ddd2"/>
  <text x="16" y="23.5" text-anchor="middle"
        font-family="Source Serif 4, Georgia, serif" font-size="22" fill="#1c1a16">n</text>
</svg>
