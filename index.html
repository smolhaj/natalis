<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Natalis</title>
    <meta name="description" content="A life simulator about the part you don't choose. You are born somewhere, in some year, to someone, and the life runs forward." />
    <meta name="theme-color" content="#f4f2ed" />
    <meta name="color-scheme" content="light" />
    <!-- Nothing declared one, so every load logged a 404 for /natalis/favicon.ico. -->
    <link rel="icon" type="image/svg+xml" href="/natalis/favicon.svg" />

    <!-- The prose is the product, so it gets a real text face. Source Serif for
         event text and Inter for the chrome; both preconnected because the
         first paint is a page of writing. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Painted before any JavaScript: the game is ~9,000 events and their
         engine, and on a phone parsing that took seconds of blank page. React
         replaces this when the game has loaded (see src/main.jsx). -->
    <div id="root"><div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f4f2ed;color:#2b2a27;font-family:'Source Serif 4',Georgia,serif;text-align:center;padding:0 16px">
      <div style="font-size:2.25rem;letter-spacing:0.02em">Natalis</div>
      <div style="margin-top:0.75rem;font-style:italic;color:#6b675f">You don't choose where you begin.</div>
      <div style="margin-top:2rem;font-family:Inter,system-ui,sans-serif;font-size:0.75rem;letter-spacing:0.12em;text-transform:uppercase;color:#9a958a">Loading the world</div>
    </div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
