<html lang="en">
  <head>

    <title>Natalis</title>
    <meta name="description" content="A life simulator about the part you don't choose. You are born somewhere, in some year, to someone, and the life runs forward." />
    <meta name="theme-color" content="#f4f2ed" />

    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&display=swap"

    />
