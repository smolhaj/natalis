name: Pages Diagnostics

on:
  workflow_dispatch:

permissions:
  pages: write
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Pages state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "=== Pages site ==="
          gh api "/repos/${GITHUB_REPOSITORY}/pages" || echo "(failed)"
          echo ""
          echo "=== Latest classic build ==="
          gh api "/repos/${GITHUB_REPOSITORY}/pages/builds/latest" || echo "(failed)"
          echo ""
          echo "=== Deployment statuses for recent SHAs ==="
          for sha in 75713aa9e1fd7d0c57de72baf1ef78592b5593cf 674b04d30f2cee67f3487ba658b1bb687bd80c72 1b9e2baf63e4eefcdb9d220a6596bd7613d8ee72 9d414ceeb4d53063c84bd47c59862ed48e067670; do
            echo "--- ${sha:0:8} ---"
            gh api "/repos/${GITHUB_REPOSITORY}/pages/deployments/${sha}" || echo "(no deployment / error)"
          done
          echo ""
          echo "=== Cancel lingering queued deployments (safe: only touches listed SHAs) ==="
          for sha in 75713aa9e1fd7d0c57de72baf1ef78592b5593cf; do
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/pages/deployments/${sha}/cancel" \
              && echo "cancelled ${sha:0:8}" || echo "nothing to cancel for ${sha:0:8}"
          done
