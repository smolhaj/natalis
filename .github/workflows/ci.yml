# Runs on pull requests and on pushes to main. Deploy (deploy.yml) is a separate
# workflow that only fires on main, so until now nothing verified a pull request
# at all — the test suite and the flag audit existed but gated nothing.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # jsdom 30 declares engines.node "^22.22.2 || ^24.15.0 || >=26.0.0" and
      # pulls undici 8, which needs >=22.19.0 and calls
      # worker_threads.markAsUncloneable — a function that does not exist before
      # Node 22.10. On Node 20 the jsdom worker died on start with
      # "webidl.util.markAsUncloneable is not a function", which vitest reports
      # as an unhandled error after every other test has passed, so the run read
      # "276 passed, 1 error". The pin predates jsdom being a dependency at all.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Build
        run: npm run build

      # There was no linter until September 2026, and two of that pass's defects
      # were exactly what one reports for free: a variable computed from an OR
      # and never used, and a re-export that left a name unbound and killed 180
      # of 200 simulated lives while all 224 unit tests passed. The config is
      # narrow on purpose — the rules that catch a real bug at error level and
      # nothing stylistic — so this step failing means something is actually
      # wrong. Inherited dead code reports as a warning and does not gate.
      - name: Lint
        run: npm run lint

      # Content integrity: every registered flag must be set somewhere and
      # consumed in the way its declared intent promises.
      #
      # check-flags reports orphaned/partial counts but exits 0, so running it
      # alone would be a step that can never fail. Assert on its own summary
      # line instead of editing the script's exit code, which keeps this honest
      # whether or not the script later starts exiting non-zero itself.
      - name: Flag audit
        run: |
          set -o pipefail
          out=$(npm run --silent check-flags | sed 's/\x1b\[[0-9;]*m//g')
          echo "$out" | tail -40
          summary=$(echo "$out" | grep -E '^Coverage:' || true)
          if [ -z "$summary" ]; then
            echo "::error::check-flags produced no Coverage summary line"
            exit 1
          fi
          echo "$summary"
          if ! echo "$summary" | grep -qE '0 partial +0 orphaned'; then
            echo "::error::Flag registry has orphaned or partial flags: $summary"
            exit 1
          fi

      # Fast suite: unit tests plus the static reachability audits (effect purity,
      # phase/guard-age, enum domains, save migration). Seconds, not minutes.
      - name: Tests
        run: npm run test:fast

      # Reachability audits over the imported corpus — dead guards, enum domains,
      # phase and year windows. Content the engine can never reach.
      - name: Reachability audit
        run: npm run check-events

  # The simulation guardrails run the REAL engine over ~1,000 whole lives, which
  # takes minutes rather than seconds. Split into its own job so it runs
  # CONCURRENTLY with the fast checks: the PR still gates on it, but wall-clock
  # is the slower of the two jobs instead of their sum.
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # These are the guardrails for the failure class the audit found: content
      # that is authored but statistically or mechanically unreachable, which no
      # static check can see. Asserts register mix, prose-layer coverage, glimpse
      # cadence, death ages against the historical record, and that no country x
      # era x mode combination throws.
      - name: Simulation guardrails
        run: npm run test:sim
