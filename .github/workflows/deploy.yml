name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
        continue-on-error: true
      - name: Wait out slow Pages queue
        if: steps.deployment.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # deploy-pages caps its own timeout at 10 minutes, but a queued
          # deployment keeps processing after the action gives up (and even
          # after the action's cancel request). Poll it to completion.
          echo "deploy-pages gave up; polling deployment ${GITHUB_SHA} directly"
          deadline=$(( $(date +%s) + 2700 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            status=$(gh api "/repos/${GITHUB_REPOSITORY}/pages/deployments/${GITHUB_SHA}" --jq .status 2>/dev/null || echo unknown)
            echo "$(date -u +%H:%M:%S) status: ${status}"
            case "$status" in
              succeed)
                echo "Deployment succeeded."
                exit 0
                ;;
              deployment_failed|deployment_content_failed|deployment_attempt_error)
                echo "Deployment failed hard."
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "Deployment did not land within 45 extra minutes."
          exit 1
