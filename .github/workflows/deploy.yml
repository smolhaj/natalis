name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Cancel any stuck Pages deployment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A deployment wedged in deployment_queued blocks all new deploys
          # with "in progress deployment" 400s. Cancel known-stuck IDs and
          # this run's own SHA (in case a previous attempt left it queued).
          for id in 9d414ceeb4d53063c84bd47c59862ed48e067670 "${GITHUB_SHA}"; do
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/pages/deployments/${id}/cancel" 2>/dev/null \
              && echo "Cancelled stuck deployment ${id}" \
              || echo "No stuck deployment ${id} (ok)"
          done
      - uses: actions/deploy-pages@v4
        id: deployment
